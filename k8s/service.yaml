# LoadBalancer: gets an external IP on GKE/EKS/AKS.
# Minikube: run `minikube tunnel` in another terminal to get an EXTERNAL-IP.
# Docker Desktop: served on http://localhost:80
apiVersion: v1
kind: Service
metadata:
  name: heart-api
  namespace: heart-risk
  labels:
    app.kubernetes.io/name: heart-api
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: heart-api
  ports:
    - name: http
      port: 80
      targetPort: http
